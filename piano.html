<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Piano</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .info {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .piano-container {
            display: flex;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
        }

        .piano {
            position: relative;
            display: flex;
            gap: 0;
            background: #333;
            padding: 15px;
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .white-keys {
            display: flex;
            gap: 2px;
            position: relative;
        }

        .key {
            position: relative;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: all 0.1s ease;
            font-weight: bold;
            font-size: 0.9em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8px;
        }

        .white-key {
            width: 60px;
            height: 300px;
            background: #fff;
            border: 2px solid #ccc;
            color: #333;
            box-shadow: 
                0 5px 10px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .white-key:hover {
            background: #f5f5f5;
        }

        .white-key.active {
            background: #e8e8e8;
            box-shadow: 
                0 2px 5px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(0, 0, 0, 0.2);
            transform: scale(0.98);
        }

        .black-keys {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            pointer-events: none;
        }

        .black-key-wrapper {
            position: relative;
            width: 62px;
            height: 200px;
            pointer-events: auto;
        }

        .black-key {
            position: absolute;
            width: 40px;
            height: 180px;
            background: #222;
            border: 2px solid #000;
            color: #fff;
            border-radius: 5px;
            left: 21px;
            top: 0;
            box-shadow: 
                0 5px 10px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            font-size: 0.75em;
        }

        .black-key:hover {
            background: #333;
        }

        .black-key.active {
            background: #111;
            box-shadow: 
                0 2px 5px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(0, 0, 0, 0.5);
            transform: scaleY(0.95);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        input[type="range"] {
            min-width: 150px;
            cursor: pointer;
        }

        select {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            background: white;
            color: #333;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #764ba2;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .keyboard-guide {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .keyboard-guide h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .keyboard-guide p {
            color: #666;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .keyboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .keyboard-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .key-label {
            background: white;
            border: 1px solid #ddd;
            padding: 5px 10px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .key-label kbd {
            background: #667eea;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 5px;
        }

        .stats {
            text-align: center;
            color: #999;
            font-size: 0.85em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .white-key {
                width: 45px;
                height: 200px;
                font-size: 0.7em;
            }

            .black-key-wrapper {
                width: 47px;
                height: 140px;
            }

            .black-key {
                width: 30px;
                height: 130px;
                left: 15.5px;
            }

            .controls {
                gap: 10px;
            }

            .control-group {
                gap: 5px;
            }

            input[type="range"] {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎹 Interactive Piano</h1>
        <p class="info">Click keys or use your keyboard to play</p>

        <div class="controls">
            <div class="control-group">
                <label for="volume">Volume:</label>
                <input type="range" id="volume" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label for="waveform">Waveform:</label>
                <select id="waveform">
                    <option value="sine">Sine</option>
                    <option value="square">Square</option>
                    <option value="sawtooth">Sawtooth</option>
                    <option value="triangle">Triangle</option>
                </select>
            </div>
            <div class="control-group">
                <label for="octave">Octave:</label>
                <select id="octave">
                    <option value="2">2 (Low)</option>
                    <option value="3">3</option>
                    <option value="4" selected>4 (Middle)</option>
                    <option value="5">5</option>
                    <option value="6">6 (High)</option>
                </select>
            </div>
            <button id="recordBtn">🔴 Record</button>
            <button id="playbackBtn" disabled>▶️ Playback</button>
            <button id="clearBtn">🗑️ Clear</button>
        </div>

        <div class="piano-container">
            <div class="piano">
                <div class="white-keys" id="whiteKeys"></div>
                <div class="black-keys" id="blackKeys"></div>
            </div>
        </div>

        <div class="keyboard-guide">
            <h3>⌨️ Keyboard Shortcuts</h3>
            <div class="keyboard-grid">
                <div class="keyboard-row">
                    <div class="key-label"><kbd>A</kbd> C | <kbd>W</kbd> C# | <kbd>S</kbd> D</div>
                    <div class="key-label"><kbd>E</kbd> D# | <kbd>D</kbd> E | <kbd>F</kbd> F</div>
                    <div class="key-label"><kbd>T</kbd> F# | <kbd>G</kbd> G | <kbd>Y</kbd> G#</div>
                </div>
                <div class="keyboard-row">
                    <div class="key-label"><kbd>H</kbd> A | <kbd>U</kbd> A# | <kbd>J</kbd> B</div>
                    <div class="key-label"><kbd>K</kbd> C5 | <kbd>O</kbd> C#5 | <kbd>L</kbd> D5</div>
                    <div class="key-label"><kbd>Z</kbd> ← Octave | <kbd>X</kbd> Octave →</div>
                </div>
            </div>
        </div>

        <div class="stats">
            <p>🎵 Notes played: <span id="notesPlayed">0</span> | Recording: <span id="recordingStatus">Off</span></p>
        </div>
    </div>

    <script>
        // Audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Note frequencies for different octaves
        const noteFrequencies = {
            2: { C: 65.41, "C#": 69.30, D: 73.42, "D#": 77.78, E: 82.41, F: 87.31, "F#": 92.50, G: 98.00, "G#": 103.83, A: 110.00, "A#": 116.54, B: 123.47 },
            3: { C: 130.81, "C#": 138.59, D: 146.83, "D#": 155.56, E: 164.81, F: 174.61, "F#": 185.00, G: 196.00, "G#": 207.65, A: 220.00, "A#": 233.08, B: 246.94 },
            4: { C: 261.63, "C#": 277.18, D: 293.66, "D#": 311.13, E: 329.63, F: 349.23, "F#": 369.99, G: 392.00, "G#": 415.30, A: 440.00, "A#": 466.16, B: 493.88 },
            5: { C: 523.25, "C#": 554.37, D: 587.33, "D#": 622.25, E: 659.25, F: 698.46, "F#": 739.99, G: 784.00, "G#": 830.61, A: 880.00, "A#": 932.33, B: 987.77 },
            6: { C: 1046.50, "C#": 1108.73, D: 1174.66, "D#": 1244.51, E: 1318.51, F: 1396.91, "F#": 1479.98, G: 1568.00, "G#": 1661.22, A: 1760.00, "A#": 1864.66, B: 1975.53 }
        };

        const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
        const blackNotes = ['C#', 'D#', 'F#', 'G#', 'A#'];
        const noteOrder = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // Keyboard mapping
        const keyboardMap = {
            'a': 'C', 'w': 'C#', 's': 'D', 'e': 'D#', 'd': 'E', 'f': 'F',
            't': 'F#', 'g': 'G', 'y': 'G#', 'h': 'A', 'u': 'A#', 'j': 'B',
            'k': 'C', 'o': 'C#', 'l': 'D'
        };

        const keyboardOctaveMap = {
            'a': 4, 'w': 4, 's': 4, 'e': 4, 'd': 4, 'f': 4, 't': 4, 'g': 4, 'y': 4, 'h': 4, 'u': 4, 'j': 4,
            'k': 5, 'o': 5, 'l': 5
        };

        let activeOscillators = new Map();
        let recording = false;
        let recordedNotes = [];
        let notesPlayedCount = 0;
        let currentOctave = 4;

        // Create piano keys
        function createPiano() {
            const whiteKeysContainer = document.getElementById('whiteKeys');
            const blackKeysContainer = document.getElementById('blackKeys');

            let whiteKeyIndex = 0;
            let blackKeyIndex = 0;

            for (let i = 0; i < noteOrder.length; i++) {
                const note = noteOrder[i];
                const isBlackKey = blackNotes.includes(note);

                if (!isBlackKey) {
                    const whiteKey = document.createElement('button');
                    whiteKey.className = 'key white-key';
                    whiteKey.textContent = note;
                    whiteKey.dataset.note = note;
                    whiteKey.dataset.index = whiteKeyIndex;
                    whiteKey.addEventListener('mousedown', () => playNote(note, currentOctave, whiteKey));
                    whiteKey.addEventListener('mouseup', () => stopNote(note, currentOctave, whiteKey));
                    whiteKey.addEventListener('mouseleave', () => stopNote(note, currentOctave, whiteKey));
                    whiteKey.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        playNote(note, currentOctave, whiteKey);
                    });
                    whiteKey.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        stopNote(note, currentOctave, whiteKey);
                    });
                    whiteKeysContainer.appendChild(whiteKey);
                    whiteKeyIndex++;
                } else {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'black-key-wrapper';
                    wrapper.style.marginLeft = blackKeyIndex === 0 || blackKeyIndex === 3 ? '0px' : '0px';

                    const blackKey = document.createElement('button');
                    blackKey.className = 'key black-key';
                    blackKey.textContent = note;
                    blackKey.dataset.note = note;
                    blackKey.addEventListener('mousedown', () => playNote(note, currentOctave, blackKey));
                    blackKey.addEventListener('mouseup', () => stopNote(note, currentOctave, blackKey));
                    blackKey.addEventListener('mouseleave', () => stopNote(note, currentOctave, blackKey));
                    blackKey.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        playNote(note, currentOctave, blackKey);
                    });
                    blackKey.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        stopNote(note, currentOctave, blackKey);
                    });

                    wrapper.appendChild(blackKey);
                    blackKeysContainer.appendChild(wrapper);
                    blackKeyIndex++;
                }
            }
        }

        // Waveform generation
        function getWaveform() {
            return document.getElementById('waveform').value;
        }

        function playNote(note, octave, keyElement) {
            const noteKey = `${note}${octave}`;
            if (activeOscillators.has(noteKey)) {
                return; // Already playing
            }

            const frequency = noteFrequencies[octave][note];
            const volume = document.getElementById('volume').value / 100;
            const waveform = getWaveform();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = waveform;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = volume * 0.2;

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start();
            activeOscillators.set(noteKey, { oscillator, gainNode });

            keyElement.classList.add('active');
            notesPlayedCount++;
            document.getElementById('notesPlayed').textContent = notesPlayedCount;

            if (recording) {
                recordedNotes.push({ note, octave, time: Date.now() });
            }
        }

        function stopNote(note, octave, keyElement) {
            const noteKey = `${note}${octave}`;
            const data = activeOscillators.get(noteKey);

            if (data) {
                data.gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                setTimeout(() => {
                    data.oscillator.stop();
                    activeOscillators.delete(noteKey);
                }, 200);
            }

            keyElement.classList.remove('active');
        }

        // Keyboard input
        document.addEventListener('keydown', (e) => {
            if (e.key === 'z' || e.key === 'Z') {
                currentOctave = Math.max(2, currentOctave - 1);
                document.getElementById('octave').value = currentOctave;
                return;
            }
            if (e.key === 'x' || e.key === 'X') {
                currentOctave = Math.min(6, currentOctave + 1);
                document.getElementById('octave').value = currentOctave;
                return;
            }

            const note = keyboardMap[e.key.toLowerCase()];
            if (note) {
                const octave = keyboardOctaveMap[e.key.toLowerCase()];
                const keyElement = document.querySelector(`[data-note="${note}"]`);
                if (keyElement && !activeOscillators.has(`${note}${octave}`)) {
                    playNote(note, octave, keyElement);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            const note = keyboardMap[e.key.toLowerCase()];
            if (note) {
                const octave = keyboardOctaveMap[e.key.toLowerCase()];
                const keyElement = document.querySelector(`[data-note="${note}"]`);
                if (keyElement) {
                    stopNote(note, octave, keyElement);
                }
            }
        });

        // Recording controls
        document.getElementById('recordBtn').addEventListener('click', function() {
            recording = !recording;
            if (recording) {
                recordedNotes = [];
                this.textContent = '⏹️ Stop Recording';
                this.style.background = '#e74c3c';
                document.getElementById('recordingStatus').textContent = 'On';
            } else {
                this.textContent = '🔴 Record';
                this.style.background = '#667eea';
                document.getElementById('recordingStatus').textContent = 'Off';
                document.getElementById('playbackBtn').disabled = recordedNotes.length === 0;
            }
        });

        document.getElementById('playbackBtn').addEventListener('click', function() {
            if (recordedNotes.length === 0) return;

            let baseTime = recordedNotes[0].time;
            recordedNotes.forEach((noteData, index) => {
                const delay = (noteData.time - baseTime) / 1000;
                setTimeout(() => {
                    const keyElement = document.querySelector(`[data-note="${noteData.note}"]`);
                    if (keyElement) {
                        playNote(noteData.note, noteData.octave, keyElement);
                        setTimeout(() => stopNote(noteData.note, noteData.octave, keyElement), 100);
                    }
                }, delay * 1000);
            });
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            // Stop all playing notes
            activeOscillators.forEach(({ oscillator, gainNode }) => {
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                setTimeout(() => oscillator.stop(), 100);
            });
            activeOscillators.clear();

            // Clear recording
            recordedNotes = [];
            recording = false;
            document.getElementById('recordBtn').textContent = '🔴 Record';
            document.getElementById('recordBtn').style.background = '#667eea';
            document.getElementById('recordingStatus').textContent = 'Off';
            document.getElementById('playbackBtn').disabled = true;
            document.querySelectorAll('.key').forEach(key => key.classList.remove('active'));
        });

        document.getElementById('volume').addEventListener('input', function() {
            const volume = this.value / 100;
            activeOscillators.forEach(({ gainNode }) => {
                gainNode.gain.value = volume * 0.2;
            });
        });

        document.getElementById('octave').addEventListener('change', function() {
            currentOctave = parseInt(this.value);
        });

        // Initialize piano
        createPiano();
    </script>
</body>
</html>
